[project]
name = "taxifare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PierreYves Girardin", email = "py.girardin@gmail.com" }
]
requires-python = ">=3.12.9"
dependencies = [
    "fastapi>=0.165.0",
    "pandas<3",
    "unicorn>=2.1.4",
]

[project.scripts]
taxifare = "taxifare:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
