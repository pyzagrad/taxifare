[project]
name = "taxifare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PierreYves Girardin", email = "py.girardin@gmail.com" }
]
requires-python = ">=3.12.9"
dependencies = [
    "fastapi>=0.165.0",
    "pandas<3",
    "unicorn>=2.1.4",
    "uvicorn>=0.54.0",
    "bigquery>=0.0.45",
    "db-dtypes>=1.9.0",
    "google>=3.0.0",
    "matplotlib>=3.11.2",
    "pandas<3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
taxifare = "taxifare:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
